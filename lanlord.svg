<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <style>
      .brand-accent { fill: #00d2ff; }
      .brand-primary { fill: #0066cc; }
      .brand-text-dark { fill: #1e293b; }
      .brand-subtext { fill: #64748b; }
      .plug-body { fill: #0066cc; }
      .plug-pins { fill: #ffffff; }

      /* Automatischer Dark-Mode Support */
      @media (prefers-color-scheme: dark) {
        .brand-text-dark { fill: #f8fafc; }
        .brand-primary { fill: #38bdf8; }
        .brand-subtext { fill: #94a3b8; }
        .plug-body { fill: #38bdf8; }
        .plug-pins { fill: #0f172a; }
      }
    </style>

    <!-- Linearer Farbverlauf für das Icon -->
    <linearGradient id="lanlordGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
  </defs>

  <!-- ================= ICON ================= -->
  <g transform="translate(40, 20)">
    <!-- Haus-Silhouette als Kabel-Loop -->
    <path d="M 65 24 
             L 115 64 
             L 115 120 
             A 10 10 0 0 1 105 130 
             L 75 130 
             M 53 130 
             L 25 130 
             A 10 10 0 0 1 15 120 
             L 15 64 
             Z" fill="none" stroke="url(#lanlordGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Schornstein-Akzent -->
    <path d="M 92 45 L 92 28 L 104 28 L 104 55" fill="none" stroke="url(#lanlordGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- RJ45 Patch-Stecker / Buchse unten am Kabel -->
    <rect x="53" y="122" width="22" height="16" rx="2" class="plug-body" />
    <path d="M 50 125 L 53 125 M 50 135 L 53 135" stroke="url(#lanlordGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="59" cy="130" r="1.5" class="plug-pins" />
    <circle cx="64" cy="130" r="1.5" class="plug-pins" />
    <circle cx="69" cy="130" r="1.5" class="plug-pins" />

    <!-- Krone / Topology Nodes ("Lord" + LAN) -->
    <!-- Verbindungslinien -->
    <path d="M 38 92 L 65 58 L 92 92 L 65 82 Z" fill="url(#lanlordGrad)" fill-opacity="0.15" stroke="url(#lanlordGrad)" stroke-width="5" stroke-linejoin="round" />
    <path d="M 38 92 L 92 92" stroke="url(#lanlordGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Netzwerk-Knotenpunkte (Crown Tips) -->
    <circle cx="38" cy="92" r="6" fill="#00d2ff" />
    <circle cx="65" cy="58" r="7.5" fill="#00d2ff" />
    <circle cx="92" cy="92" r="6" fill="#00d2ff" />
  </g>

  <!-- ================= TYPOGRAFIE ================= -->
  <!-- "LAN" (Akzentuiert & Bold) -->
  <text x="210" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5" class="brand-accent">LAN</text>

  <!-- "lord" (Kontrastierend) -->
  <text x="350" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="68" font-weight="700" letter-spacing="-1" class="brand-text-dark">lord</text>

  <!-- RJ45 Ports-Detail im Buchstaben "o" -->
  <g transform="translate(427, 73)">
    <rect x="0" y="0" width="18" height="15" rx="2" class="brand-subtext" opacity="0.3" />
    <line x1="3" y1="3" x2="3" y2="7" stroke="white" stroke-width="1.2" stroke-linecap="round" />
    <line x1="6" y1="3" x2="6" y2="7" stroke="white" stroke-width="1.2" stroke-linecap="round" />
    <line x1="9" y1="3" x2="9" y2="7" stroke="white" stroke-width="1.2" stroke-linecap="round" />
    <line x1="12" y1="3" x2="12" y2="7" stroke="white" stroke-width="1.2" stroke-linecap="round" />
    <line x1="15" y1="3" x2="15" y2="7" stroke="white" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Subline / Slogan -->
  <text x="214" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="1.2" class="brand-subtext">LOCAL NETWORK CONFIGURATION TOOL</text>
</svg>