[package]
name = "lanlord"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Device list for a small OpenWrt network"
repository = "https://github.com/tl-photography/lanlord"
publish = false

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
toml = "1.2.0"
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
