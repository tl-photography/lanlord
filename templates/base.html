<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - lanlord</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="lanlord, device list">
      <svg viewBox="0 0 108 104" width="34" height="33" aria-hidden="true">
        <path d="M 12 56 L 54 18 L 96 56" class="brand-line" />
        <path d="M 22 54 L 22 92 A 6 6 0 0 0 28 98 L 80 98 A 6 6 0 0 0 86 92 L 86 54" class="brand-line" />
        <path d="M 36 80 L 54 50 L 72 80 Z" class="brand-net" />
        <circle cx="54" cy="50" r="5" class="brand-node" /><circle cx="36" cy="80" r="4.5" class="brand-node" /><circle cx="72" cy="80" r="4.5" class="brand-node" />
      </svg>
      <span class="brand-name"><b>LAN</b>lord</span>
    </a>
    <nav aria-label="Main">
      <a href="/"{% if nav == "devices" %} aria-current="page"{% endif %}>Devices</a>
      <a href="/groups"{% if nav == "groups" %} aria-current="page"{% endif %}>Groups</a>
      <a href="/plugins"{% if nav == "plugins" %} aria-current="page"{% endif %}>Plugins</a>
      <a href="/apply"{% if nav == "apply" %} aria-current="page"{% endif %}>Apply</a>
    </nav>
    <a class="button add" href="/devices/new">Add device</a>
    <form class="logout" method="post" action="/logout"><button type="submit">Log out</button></form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
