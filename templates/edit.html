{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% if !error.is_empty() %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="{{ action }}">
  <label>Name <input name="name" value="{{ form.name }}" required maxlength="63" pattern="[A-Za-z0-9]([A-Za-z0-9\-]*[A-Za-z0-9])?" autocapitalize="off" spellcheck="false"></label>
  <label>MAC address <input name="mac" value="{{ form.mac }}" required autocapitalize="off" spellcheck="false" placeholder="aa:bb:cc:dd:ee:ff"></label>
  <label>Group
    <select name="group">
      {% for group in groups %}
      <option value="{{ group.name }}"{% if group.name == form.group %} selected{% endif %}>{{ group.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>IP address <input name="ip" value="{{ form.ip }}" inputmode="decimal" placeholder="optional"></label>
  <label>Note <input name="note" value="{{ form.note }}" maxlength="500"></label>
  <div class="actions">
    <button type="submit">Save</button>
    {% if has_targets %}<button type="submit" name="then" value="review" class="secondary">Save and review changes</button>{% endif %}
  </div>
</form>
{% endblock %}
