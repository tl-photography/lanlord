# The areas of the repository and the checks they need, used by ci.yml.
rust:
  - 'src/**'
  - 'tests/**.rs'
  - 'templates/**'
  - 'static/**'
  - 'assets/**'
  - 'examples/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'rustfmt.toml'
  - 'clippy.toml'
  - '.github/workflows/**'
dependencies:
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'deny.toml'
  - '.github/workflows/**'
image:
  - 'src/**'
  - 'templates/**'
  - 'static/**'
  - 'assets/**'
  - 'examples/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'Dockerfile'
  - '.dockerignore'
  - '.hadolint.yaml'
  - 'tests/container.sh'
  - '.zap/**'
  - '.github/workflows/**'
# The web interface: pages, assets and the code that serves them.
web:
  - 'templates/**'
  - 'static/**'
  - 'assets/**'
  - 'src/lib.rs'
  - 'src/auth.rs'
  - 'src/auth/**'
  - 'src/origin.rs'
  - 'src/*_ui.rs'
  - 'src/edit.rs'
  - 'src/groups.rs'
  - 'src/machines.rs'
  - 'src/apply.rs'
  - 'Cargo.lock'
  - 'Dockerfile'
  - '.zap/**'
  - '.github/workflows/**'
