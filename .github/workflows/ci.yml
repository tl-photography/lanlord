name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: cargo-llvm-cov@0.9.1

      # Targets and the exclusion of src/main.rs are explained in TESTING.md.
      - name: Measure coverage
        run: >-
          cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs'
          --fail-under-lines 90 --fail-under-regions 90 --lcov --output-path lcov.info

      - name: Show the coverage summary
        if: always()
        run: |
          {
            echo '```'
            cargo llvm-cov report --ignore-filename-regex 'src/main\.rs' --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-lcov
          path: lcov.info

  dependencies:
    name: Check dependencies (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # The full history, not only the pushed commits.
      - name: Run TruffleHog
        run: >-
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.8
          git file:///repo --results=verified,unknown --fail --no-update

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Rust and the secret scan run in their own jobs.
      - name: Run pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy,trufflehog
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  docker:
    name: Build, smoke-test and scan the image
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: lanlord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container security tests
        run: tests/container.sh lanlord:ci

      - name: Start the container for the web scan
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          cp examples/lanlord.toml "$RUNNER_TEMP/data/"
          docker run -d --name lanlord-zap --read-only --cap-drop ALL \
            --security-opt no-new-privileges -v "$RUNNER_TEMP/data:/data:ro" \
            -p 127.0.0.1:8080:8080 lanlord:ci
          for _ in $(seq 30); do
            docker exec lanlord-zap /lanlord healthcheck && exit 0
            sleep 1
          done
          exit 1

      # Passive scan of the running web interface; accepted findings are in .zap/rules.tsv.
      - name: Scan the web interface with ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://127.0.0.1:8080/
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lanlord:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Check the image against the CIS Docker Benchmark
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level warn lanlord:ci

      - name: Check the Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
