name: CI

# Branches are checked in their pull request, main after the merge: one run per change, not two.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every check, whatever changed
        type: boolean
        default: false

# A new push to a pull request stops the run of the push before.
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only the checks a change needs; releases and manual runs check everything.
  changes:
    name: Find the checks to run
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
      # The results of the previous push of a pull request.
      actions: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      coverage: ${{ steps.decide.outputs.coverage }}
      dependencies: ${{ steps.decide.outputs.dependencies }}
      image: ${{ steps.decide.outputs.image }}
      web: ${{ steps.decide.outputs.web }}
    steps:
      # The head of a pull request with its history, so the changes since the last push can be listed.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Decide whether to run everything
        id: full
        env:
          FULL: ${{ inputs.full == true || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
        run: echo "all=$FULL" >> "$GITHUB_OUTPUT"

      - name: List the changed areas
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: .github/path-filters.yml

      # A later push to a pull request skips a check whose area it does not touch and that passed on the push before.
      # A check that failed always runs again: a skipped check counts as passed.
      - name: List the areas changed since the last push
        id: delta
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          token: ''
          base: ${{ github.event.before }}
          filters: .github/path-filters.yml

      - name: Read the results of the last push
        id: previous
        if: steps.delta.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=pull_request&status=completed" \
            --jq '.workflow_runs[0].id // empty')
          if [ -n "$run" ]; then
            gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | "\(.name)=\(.conclusion)"' > previous.txt
          fi
          passed() { grep -qxE "$1=(success|skipped)" previous.txt 2>/dev/null && echo true || echo false; }
          {
            echo "rust=$(passed 'Format, lint and test')"
            echo "coverage=$(passed 'Test coverage')"
            echo "dependencies=$(passed 'Check dependencies \(advisories, licenses, sources\)')"
            echo "image=$(passed 'Build, smoke-test and scan the image')"
          } >> "$GITHUB_OUTPUT"

      - name: Decide which checks run
        id: decide
        env:
          FULL: ${{ steps.full.outputs.all }}
          DELTA: ${{ steps.previous.outcome }}
          AREA_RUST: ${{ steps.filter.outputs.rust }}
          AREA_DEPENDENCIES: ${{ steps.filter.outputs.dependencies }}
          AREA_IMAGE: ${{ steps.filter.outputs.image }}
          AREA_WEB: ${{ steps.filter.outputs.web }}
          NEW_RUST: ${{ steps.delta.outputs.rust }}
          NEW_DEPENDENCIES: ${{ steps.delta.outputs.dependencies }}
          NEW_IMAGE: ${{ steps.delta.outputs.image }}
          NEW_WEB: ${{ steps.delta.outputs.web }}
          PASSED_RUST: ${{ steps.previous.outputs.rust }}
          PASSED_COVERAGE: ${{ steps.previous.outputs.coverage }}
          PASSED_DEPENDENCIES: ${{ steps.previous.outputs.dependencies }}
          PASSED_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          # needed <area in the pull request> <area changed since the last push> <passed on the last push>
          needed() {
            if [ "$FULL" = true ]; then echo true
            elif [ "$1" != true ]; then echo false
            elif [ "$DELTA" = success ] && [ "$2" = false ] && [ "$3" = true ]; then echo false
            else echo true
            fi
          }
          {
            echo "rust=$(needed "$AREA_RUST" "$NEW_RUST" "$PASSED_RUST")"
            echo "coverage=$(needed "$AREA_RUST" "$NEW_RUST" "$PASSED_COVERAGE")"
            echo "dependencies=$(needed "$AREA_DEPENDENCIES" "$NEW_DEPENDENCIES" "$PASSED_DEPENDENCIES")"
            echo "image=$(needed "$AREA_IMAGE" "$NEW_IMAGE" "$PASSED_IMAGE")"
            echo "web=$(needed "$AREA_WEB" "$NEW_WEB" "$PASSED_IMAGE")"
          } | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Format, lint and test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install clippy-sarif
        if: always()
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: clippy-sarif@0.8.0

      # The lints again as SARIF for code scanning; the step above decides the result.
      - name: Write the lints as SARIF
        if: always()
        run: cargo clippy --all-targets --locked --message-format=json | clippy-sarif > clippy.sarif

      # Pull requests from forks get no write token.
      - name: Upload the lints to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: clippy.sarif
          category: clippy

      - name: Test
        run: cargo test --locked

  coverage:
    name: Test coverage
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-llvm-cov@0.9.1

      # Targets and the exclusion of src/main.rs are explained in TESTING.md.
      - name: Measure coverage
        run: >-
          cargo llvm-cov --locked --ignore-filename-regex 'src/main\.rs'
          --fail-under-lines 90 --fail-under-regions 90 --lcov --output-path lcov.info

      - name: Show the coverage summary
        if: always()
        run: |
          {
            echo '```'
            cargo llvm-cov report --ignore-filename-regex 'src/main\.rs' --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-lcov
          path: lcov.info

      # One comment per pull request, updated on every push; forks get no write token.
      - name: Comment the coverage on the pull request
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Test coverage'
            echo
            echo '```'
            cargo llvm-cov report --ignore-filename-regex 'src/main\.rs' --summary-only
            echo '```'
            echo
            echo 'Targets: 90 % lines and regions, see TESTING.md.'
          } > coverage-comment.md
          gh pr comment "$PR_NUMBER" --body-file coverage-comment.md --edit-last --create-if-none

  dependencies:
    name: Check dependencies (advisories, licenses, sources)
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources

  secrets:
    name: Scan for secrets
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # The full history, not only the pushed commits.
      - name: Run TruffleHog
        run: >-
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.8
          git file:///repo --results=verified,unknown --fail --no-update

  hooks:
    name: Pre-commit hooks
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Rust and the secret scan run in their own jobs.
      - name: Run pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy,trufflehog
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  docker:
    name: Build, smoke-test and scan the image
    # Next to the Rust job, not after it: the image is the longest job.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: lanlord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container security tests
        run: tests/container.sh lanlord:ci

      - name: Start the container for the web scan
        if: needs.changes.outputs.web == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          cp examples/groups.toml "$RUNNER_TEMP/data/"
          docker run -d --name lanlord-zap --read-only --cap-drop ALL \
            --security-opt no-new-privileges -v "$RUNNER_TEMP/data:/data:ro" \
            -p 127.0.0.1:8080:8080 lanlord:ci
          for _ in $(seq 30); do
            docker exec lanlord-zap /lanlord healthcheck && exit 0
            sleep 1
          done
          exit 1

      # Passive scan of the running web interface; accepted findings are in .zap/rules.tsv.
      - name: Scan the web interface with ZAP
        if: needs.changes.outputs.web == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://127.0.0.1:8080/
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lanlord:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Check the image against the CIS Docker Benchmark
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level warn lanlord:ci

      - name: Check the Dockerfile for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'

      # All findings for code scanning; the scans above decide the result.
      - name: Write the image findings as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lanlord:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Write the Dockerfile findings as SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif

      - name: Upload the image findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload the Dockerfile findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
