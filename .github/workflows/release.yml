name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # Needed by the path filter in ci.yml, which may not ask for more than this workflow allows.
  pull-requests: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # contents: write attaches the SBOM files to the release.
      contents: write
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=lanlord
            org.opencontainers.image.description=Device list for a small OpenWrt network
          annotations: |
            org.opencontainers.image.title=lanlord
            org.opencontainers.image.description=Device list for a small OpenWrt network
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      # SBOM and provenance are attached to the image in the registry.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach the SBOM of the image to the release
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          format: spdx-json
          artifact-name: lanlord-${{ github.event.release.tag_name }}-image.spdx.json
          upload-release-assets: true

      - name: Attach the SBOM of the Rust dependencies to the release
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          artifact-name: lanlord-${{ github.event.release.tag_name }}-dependencies.cdx.json
          upload-release-assets: true
